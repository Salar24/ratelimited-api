upstream api {
    # Docker's DNS returns every replica of the "api" service; nginx
    # round-robins across all of them.
    server api:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        # Appends the client address; the API reads the last hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # Metrics are scraped directly from each replica, not via the proxy.
    location = /metrics {
        return 404;
    }
}
