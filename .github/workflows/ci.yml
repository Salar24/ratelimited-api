name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: links
          POSTGRES_PASSWORD: links
          POSTGRES_DB: links
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U links" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      - name: Test (unit + Redis/Postgres integration)
        env:
          REDIS_ADDR: localhost:6379
          TEST_DATABASE_URL: postgres://links:links@localhost:5432/links?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    needs: test
    env:
      # Near-zero refill makes the shared-bucket assertion deterministic.
      RATE_LIMIT_RPS: "0.01"
      RATE_LIMIT_BURST: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build --wait api postgres redis nginx prometheus

      - name: Wait for API through nginx
        run: |
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/healthz && exit 0
            sleep 1
          done
          docker compose logs api
          exit 1

      - name: Create and resolve a link
        run: |
          curl -fsS -X POST localhost:8080/api/v1/links \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://github.com/Salar24","code":"e2e-test"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/e2e-test)" = 302

      - name: Rate limit is shared across replicas
        # Burst is 10 per client and the previous step spent 2 tokens. With
        # per-instance buckets, two replicas would allow ~18 more requests;
        # one shared Redis bucket allows 8.
        run: |
          allowed=0; limited=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/links/e2e-test)
            case "$code" in
              200) allowed=$((allowed+1)) ;;
              429) limited=$((limited+1)) ;;
              *) echo "unexpected status $code"; exit 1 ;;
            esac
          done
          echo "allowed=$allowed limited=$limited"
          echo "Shared rate limit: **$allowed allowed / $limited limited** of 30 requests" >> "$GITHUB_STEP_SUMMARY"
          test "$allowed" -ge 7 && test "$allowed" -le 9

      - name: Prometheus scrapes both replicas
        run: |
          for i in $(seq 1 30); do
            n=$(curl -s 'localhost:9090/api/v1/query?query=count(up%7Bjob%3D%22ratelimited-api%22%7D%3D%3D1)' \
                | jq -r '.data.result[0].value[1] // "0"')
            echo "healthy targets: $n"
            [ "$n" = "2" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  image:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/salar24/ratelimited-api:latest
            ghcr.io/salar24/ratelimited-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
